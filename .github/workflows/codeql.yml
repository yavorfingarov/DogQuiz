name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: 30 9 * * 1

permissions:
  contents: read

env:
  DOTNET_VERSION: 9.0.x

jobs:
  scan:
    name: Scan
    runs-on: windows-latest
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false

      - name: Set up .NET
        if: ${{ matrix.build-mode == 'manual' }}
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@76621b61decf072c1cee8dd1ce2d2a82d33c17ed
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Initialize
        if: ${{ matrix.build-mode == 'manual' }}
        run: .\build\run.ps1 --exclusive --target Initialize

      - name: Restore NuGet packages
        if: ${{ matrix.build-mode == 'manual' }}
        run: .\build\run.ps1 --exclusive --target RestoreNuGetPackages

      - name: Build
        if: ${{ matrix.build-mode == 'manual' }}
        run: .\build\run.ps1 --exclusive --target Build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@76621b61decf072c1cee8dd1ce2d2a82d33c17ed
        with:
          category: "/language:${{matrix.language}}"
